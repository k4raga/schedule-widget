<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расписание</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="titlebar">
      <span class="time" id="clock">--:--</span>

      <div class="titlebar-right">
        <button class="titlebar-btn icon-btn" id="syncButton" type="button" aria-label="Синк" title="Синк">⇄</button>

        <button class="titlebar-btn icon-btn" id="dbSyncButton" type="button" aria-label="Синк базы" title="Синк базы">⇅</button>

        <button class="titlebar-btn icon-btn" id="dockButton" type="button" aria-label="&#1055;&#1072;&#1085;&#1077;&#1083;&#1100; &#1089;&#1083;&#1077;&#1074;&#1072;" title="&#1055;&#1072;&#1085;&#1077;&#1083;&#1100; &#1089;&#1083;&#1077;&#1074;&#1072;">▌</button>

        <div class="date-nav">
          <button class="date-nav-btn" id="prevDayButton" type="button" aria-label="Предыдущий день">‹</button>
          <button class="date-display" id="dateButton" type="button" aria-label="Выбрать дату">
            <span id="dateLabel">--</span>
          </button>
          <button class="date-nav-btn" id="nextDayButton" type="button" aria-label="Следующий день">›</button>
        </div>
      </div>
    </div>

    <input id="dateInput" class="ghost-date-input" type="date" aria-hidden="true" tabindex="-1" />

    <main class="content" id="content">
      <div class="loading-state">Загрузка...</div>
    </main>

    <footer class="footer">
      <span id="stats">--</span>
      <div class="footer-right">
        <span id="statusLine">ГОТОВО</span>
        <span>лок</span>
      </div>
    </footer>

    <script src="./schedule-helpers.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
