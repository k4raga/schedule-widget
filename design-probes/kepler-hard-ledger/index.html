<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hard Ledger Probe</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="widget">
      <header class="topbar">
        <div class="clock">14:32</div>
        <div class="day-block">
          <span class="kicker">сегодня</span>
          <span class="date">чт, 9 апреля</span>
        </div>
        <button class="sync-btn" type="button">SYNC</button>
      </header>

      <main class="main">
        <section class="hero">
          <span class="kicker">в фокусе</span>
          <h1>Переоформить заявление на вычет</h1>
          <p>12:00-13:00 · 28 мин осталось</p>
        </section>

        <section class="board">
          <div class="row row-done">
            <span class="time">09:00-09:30</span>
            <span class="title">Планирование дня</span>
            <span class="state">done</span>
          </div>
          <div class="row row-progress">
            <span class="time">09:30-10:00</span>
            <span class="title">Навык: печать</span>
            <span class="state">in progress</span>
          </div>
          <div class="row">
            <span class="time">10:00-11:00</span>
            <span class="title">Никамед</span>
            <span class="state">todo</span>
          </div>
          <div class="row">
            <span class="time">11:00-12:00</span>
            <span class="title">Оценка СПб</span>
            <span class="state">todo</span>
          </div>
          <div class="row row-muted">
            <span class="time">22:30-23:00</span>
            <span class="title">Ужин + отчет</span>
            <span class="state">queued</span>
          </div>
        </section>
      </main>

      <footer class="statusline">Статус: локальный режим · обновлено 14:32</footer>
    </div>
  </body>
</html>
